    patch:
      tags: [Catalog]
      operationId: patchProduct
      summary: >
        Update a product. If the target is a mutable draft (never published, no
        checkout reference chain) it mutates in place and returns 200. If the
        target is immutable (published, or checkout-referenced via one of its
        plans/prices) this creates a new version instead: response is 201 with a
        NEW resource whose id differs from the path {product_id} and whose
        supersedes_product_id points at the old id. The old row is untouched.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductRequest'
      responses:
        '200':
          description: Product updated in place (was a mutable draft)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
        '201':
          description: New product version created (target was immutable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
        default:
          description: Error updating product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Catalog]
      operationId: deleteProduct
      summary: Hard-delete a product. Only legal for a draft, never-published product with no checkout reference chain.
