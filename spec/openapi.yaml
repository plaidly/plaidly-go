openapi: "3.1.0"
info:
  title: plaidly API
  description: >
    The plaidly API provides a set of endpoints for managing information within
    the plaidly backend system.
  version: "1.0"
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /v1/merchants/email-verification:
    post:
      tags: [Merchants]
      security: []
      operationId: requestEmailVerification
      summary: Request a one-time email verification code for sandbox merchant registration
      description: >
        First step of public/sandbox registration. Always returns the same
        response shape regardless of whether the email is on the trusted-email
        policy, so the response never reveals trust-policy membership or
        account existence; a real code is only dispatched for emails that
        satisfy the active trusted-email policy or supply a valid invitation
        token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailVerificationRequest'
      responses:
        '200':
          description: Verification challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEmailVerificationResponse'
        default:
          description: Error requesting email verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/merchants/email-verification/confirm:
    post:
      tags: [Merchants]
      security: []
      operationId: confirmEmailVerification
      summary: Confirm a one-time email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailVerificationRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmEmailVerificationResponse'
        default:
          description: Error confirming email verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/merchants/registration-proof-of-work:
    post:
      tags: [Merchants]
      security: []
      operationId: requestRegistrationProofOfWork
      summary: Request a proof-of-work challenge for sandbox merchant registration
      description: >
        Second step of public/sandbox registration, after email verification.
        Required before POST /v1/merchants proceeds unless the registration
        intent carries a valid, unexpired invitation token, in which case
        required is false and no challenge is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRegistrationProofOfWorkRequest'
      responses:
        '200':
          description: Proof-of-work challenge issued, or not required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRegistrationProofOfWorkResponse'
        default:
          description: Error requesting a proof-of-work challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/merchants:
    post:
      tags: [Merchants]
      security: []
      operationId: registerMerchant
      summary: Register a merchant and receive an API key
      description: >
        Public only for sandbox merchant onboarding. Non-sandbox merchant
        creation requires a bearer-authenticated user. Public/sandbox
        registration additionally requires registration_intent_id from a
        completed email-verification + proof-of-work sequence (see
        POST /v1/merchants/email-verification and
        POST /v1/merchants/registration-proof-of-work).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
      responses:
        '201':
          description: Merchant registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        default:
          description: Error registering merchant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me:
    get:
      tags: [Merchants]
      operationId: getMe
      summary: Get the currently authenticated merchant's info
      responses:
        '200':
          description: Current merchant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        default:
          description: Error fetching merchant info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/credentials:
    get:
      tags: [Merchants]
      operationId: getMerchantCredentialStatus
      summary: Get the authenticated merchant's credential status
      description: >
        Returns non-sensitive metadata about the merchant's current API key and
        webhook secret: masked previews, creation/rotation timestamps, and
        rotation-overlap grace period expiry. Never returns a usable credential
        value.
      responses:
        '200':
          description: Current credential status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantCredentialStatus'
        default:
          description: Error fetching merchant credential status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/credentials/rotate:
    post:
      tags: [Merchants]
      operationId: rotateMerchantCredential
      summary: Rotate the authenticated merchant's API key or webhook secret
      description: >
        Rotates a merchant credential and keeps the previous credential valid for
        a short overlap window. API keys continue authenticating during that
        window, and webhook secret rotation emits signatures for both the new
        and previous secret so receivers can switch without downtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCredentialOperationRequest'
      responses:
        '200':
          description: Credential rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        default:
          description: Error rotating merchant credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/credentials/revoke:
    post:
      tags: [Merchants]
      operationId: revokeMerchantCredential
      summary: Revoke the authenticated merchant's previous overlapping credential
      description: >
        Revokes the previous credential created by the most recent rotation,
        ending the overlap window early. For webhook secrets, receivers should
        reject signatures older than the timestamp tolerance and track a replay
        key derived from the verified signature during that window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCredentialOperationRequest'
      responses:
        '200':
          description: Previous overlapping credential revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        default:
          description: Error revoking merchant credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/payment_method_policy:
    get:
      tags: [Merchants]
      operationId: getPaymentMethodPolicy
      summary: Get the authenticated merchant's payment-method policy
      description: >
        Returns the merchant's current declared payment-method policy version
        together with the live-computed eligibility for every candidate
        identity, so a dashboard can render why a method is greyed out. A
        merchant with no policy version yet, or a version with zero enabled
        entries, has an empty effective policy; it never falls back to every
        globally supported method.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Current payment-method policy state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodPolicyState'
        default:
          description: Error fetching payment-method policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Merchants]
      operationId: updatePaymentMethodPolicy
      summary: Replace the authenticated merchant's payment-method policy
      description: >
        Accepts the merchant's full desired set of enabled chain/network/token
        identities and writes a new immutable policy version. Every requested
        identity is validated against the canonical registry, settlement
        implementation, environment enablement, and certification gates; if
        any identity fails, the whole request is rejected with 422 and no
        version is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentMethodPolicyRequest'
      responses:
        '200':
          description: Payment-method policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodPolicyState'
        default:
          description: Error updating payment-method policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/webhook:
    put:
      tags: [Merchants]
      operationId: updateMerchantWebhook
      summary: Update the authenticated merchant's webhook URL
      description: >
        Replaces the merchant's webhook URL after SSRF validation (blocks
        localhost/metadata/internal/private-range hosts) and audit-logs the
        sanitized before/after URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantWebhookRequest'
      responses:
        '200':
          description: Webhook URL updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        default:
          description: Error updating webhook URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/webhook/test:
    post:
      tags: [Merchants]
      operationId: testMerchantWebhookDelivery
      summary: Send a test delivery to the authenticated merchant's configured webhook
      description: >
        Delivers a synthetic event through the same signed, SSRF-guarded
        delivery path used for real webhook events, so the merchant can
        confirm their endpoint receives and verifies deliveries.
      responses:
        '200':
          description: Test delivery attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestDeliveryResult'
        default:
          description: Error sending test delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/login:
    post:
      tags: [Me]
      security: []
      operationId: userLogin
      summary: Logs in a user, sets an HttpOnly browser session cookie, and returns user details
      parameters:
        - in: header
          name: Authorization
          required: false
          schema:
            type: string
          description: "Bearer Firebase ID token. May be used instead of the JSON body token."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: "User auth token"
      responses:
        '200':
          description: Successful login response with user details. Also sets `plaidly_session` as an HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Login error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/me/register:
    post:
      tags: [Me]
      security: []
      operationId: userRegister
      summary: Registers a new user
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: "Bearer JWT token"
      responses:
        '201':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/wallets:
    post:
      tags: [Wallets]
      operationId: createWallet
      summary: Create a new wallet for a user
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        default:
          description: Error creating wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Wallets]
      operationId: listWallets
      summary: List all wallets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
        default:
          description: Error fetching wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/wallets/{wallet_id}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Get wallet info by ID
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
          description: Wallet ID
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        default:
          description: Error fetching wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/wallets/{wallet_id}/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for a wallet
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
          description: Wallet ID
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        default:
          description: Error fetching transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payouts:
    post:
      tags: [Payouts]
      operationId: requestPayout
      summary: Request a new payout
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: "Unique key for replay-safe payout creation. Retrying with the same key and an identical payload within 24 hours returns the original payout with status 201; the same key with a different payload returns 409. Keys are scoped per merchant."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPayoutRequest'
      responses:
        '201':
          description: Payout requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        default:
          description: Error requesting payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payouts/{payout_id}:
    get:
      tags: [Payouts]
      operationId: getPayout
      summary: Get payout status
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: payout_id
          in: path
          required: true
          schema:
            type: string
          description: Payout ID
      responses:
        '200':
          description: Payout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        default:
          description: Error fetching payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/agent-wallets/{agent_wallet_id}/spend-attempts:
    post:
      tags: [Agent Wallets]
      operationId: attemptAgentWalletSpend
      summary: Evaluate and record an outbound spend attempt for an agent wallet
      parameters:
        - name: agent_wallet_id
          in: path
          required: true
          schema:
            type: string
          description: Agent wallet ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSpendAttemptRequest'
      responses:
        '200':
          description: Spend attempt evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpendAttempt'
        default:
          description: Error attempting spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions:
    post:
      tags: [PaymentSessions]
      operationId: createPaymentSession
      summary: Create a new payment session (deposit)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: "Unique key for replay-safe session creation. Retrying with the same key and an identical payload within 24 hours returns the original session (same session_id and deposit address) with status 201; the same key with a different payload returns 409. Keys are scoped per merchant."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentSessionRequest'
      responses:
        '201':
          description: Created payment session (or, when the request used paymentMethods, a checkout intent awaiting selection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSessionOrIntent'
        default:
          description: Error creating payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/demo:
    post:
      tags: [PaymentSessions]
      operationId: createDemoPaymentSession
      summary: Create a new demo payment session (deposit)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoSessionRequest'
      responses:
        '201':
          description: Created payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        default:
          description: Error creating payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/{session_id}/fulfill:
    post:
      tags: [PaymentSessions]
      summary: Fulfill a demo payment session (simulate payment)
      operationId: fulfillDemoPaymentSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Demo session ID
      responses:
        '200':
          description: Demo session fulfilled successfully
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error fulfilling session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/{session_id}/provide_wallet:
    post:
      tags: [PaymentSessions]
      summary: Provide a funded dev wallet for the demo session
      operationId: provideDevWalletForDemo
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Demo session ID
      responses:
        '200':
          description: Dev wallet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: object
                    required: [publicKey, privateKey, explorerURL]
                    properties:
                      publicKey:
                        type: string
                      privateKey:
                        type: string
                      explorerURL:
                        type: string
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error creating dev wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/{session_id}:
    get:
      tags: [PaymentSessions]
      operationId: getPaymentSession
      summary: Get payment session details
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Payment session ID
      responses:
        '200':
          description: Payment session details (or, before a method has been selected, the checkout intent's candidate snapshot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSessionOrIntent'
        default:
          description: Error fetching payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/{session_id}/select_method:
    post:
      tags: [PaymentSessions]
      operationId: selectPaymentMethod
      summary: Select one payment method from a checkout intent's approved candidate set
      description: >
        session_id here is the intent_id returned by POST /v1/payment_sessions
        when the request offered paymentMethods (a candidate set) instead of a
        single paymentMethod. Public: the payer authorizes with knowledge of
        the intent id, the same trust model as GET /v1/payment_sessions/{id}.
        Concurrent selections for the same intent converge to a single
        method/address; the losing caller gets the same 200 response as the
        winner rather than an error.
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Payment session intent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectPaymentMethodRequest'
      responses:
        '200':
          description: Payment method selected and bound to a materialized payment session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        default:
          description: Error selecting payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_sessions/{session_id}/webhook/retry:
    post:
      tags: [PaymentSessions]
      operationId: retryWebhookDelivery
      summary: Queue a bounded manual retry for the session webhook
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Payment session ID
      responses:
        '202':
          description: Webhook retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryStatus'
        default:
          description: Error queuing webhook retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payment_methods:
    get:
      tags: [PaymentSessions]
      operationId: listPaymentMethods
      summary: List enabled payment methods (chain/token combinations)
      security: []
      responses:
        '200':
          description: List of available payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodInfo'
        default:
          description: Error fetching payment methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/rates:
    get:
      tags: [PaymentSessions]
      operationId: getRates
      summary: Get USD spot rates for supported assets
      security: []
      parameters:
        - name: symbols
          in: query
          required: false
          schema:
            type: string
          description: "Comma-separated symbols (e.g. ETH,SOL,USDC). Omit for all."
      responses:
        '200':
          description: List of rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateInfo'
        default:
          description: Rates temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/x402/facilitator:
    post:
      tags: [x402]
      operationId: validateX402Payment
      summary: Validate an x402 payment payload
      description: >
        Validate whether the provided chain/network/token payload is currently
        supported by Plaidly payment infrastructure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/X402PaymentPayload'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402ValidationResult'
        default:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/sandbox/faucets:
    get:
      tags: [PaymentSessions]
      operationId: listSandboxFaucets
      summary: List testnet faucet URLs per chain
      security: []
      responses:
        '200':
          description: Map of chain:network to faucet URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        default:
          description: Error fetching faucets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/sandbox/faucet/fund:
    post:
      tags: [PaymentSessions]
      operationId: fundSepoliaFaucet
      summary: Send a capped amount of native Sepolia testnet ETH to an address
      description: >-
        Public sandbox faucet, distinct from GET /v1/sandbox/faucets (static
        external links). Rate-limited per address, per IP, and globally over a
        fixed 24h window. Only chain "ethereum" (Sepolia testnet) is accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundSepoliaFaucetRequest'
      responses:
        '200':
          description: Faucet transfer broadcast
          content:
            application/json:
