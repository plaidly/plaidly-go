          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDiscoveryProduct'
        default:
          description: Error fetching catalog product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/catalog/prices/{price_id}/checkout-intent:
    post:
      tags: [CatalogDiscovery]
      operationId: createCatalogCheckoutIntent
      summary: >
        Resolve a published price for checkout. Validates the price and its
        parent plan/product/store are all published and not archived, records a
        CatalogCheckoutSnapshot (which flips the price/plan/product into
        checkout-referenced immutability), and returns the fields a buyer agent
        needs to build a POST /v1/payment_sessions request.
      security: []
      parameters:
        - name: price_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Checkout intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCheckoutIntent'
        default:
          description: Error creating checkout intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT or API key in the format: 'Bearer <token>'"
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Merchant API key for server-to-server authentication"

  schemas:
    User:
      type: object
      description: User model containing essential user details
      required:
        - id
        - personal_wallet_address
        - created_wallet_address
        - last_login_at
      properties:
        id:
          type: string
          description: "User's ID"
        personal_wallet_address:
          type: string
          description: "The user's personal wallet address"
        created_wallet_address:
          type: string
          description: "The address of the wallet created for the user"
        last_login_at:
          type: string
          description: "The last login timestamp in Unix format"
          example: "1672531200"

    Error:
      type: object
      description: General error model
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int64
          description: "Error code"
        message:
          type: string
          description: "Error message"
        field:
          type: string
          description: "Optional: name of the request field that caused the error"
        remediation:
          type: string
          description: "Optional: human-readable suggestion for how to resolve the error"
        request_id:
          type: string
          description: "Optional: identifier for correlating this error with server-side logs"
        retryable:
          type: boolean
          description: "Optional: whether retrying the same request may succeed"
        retry_after_seconds:
          type: integer
          format: int64
          description: "Optional: seconds to wait before retrying, present on rate-limit errors"

    CreateWalletRequest:
      type: object
      required:
        - user_id
        - chain
        - token
      properties:
        user_id:
          type: string
        chain:
          type: string
        token:
          type: string

    Wallet:
      type: object
      required:
        - id
        - network
        - address
        - private_key_encrypted
        - type
        - created_at
      properties:
        id:
          type: string
        network:
          type: string
        address:
          type: string
        private_key_encrypted:
          type: string
        type:
          type: string
          description: "session, cold, or hot"
        assigned_session_id:
          type: string
        created_at:
          type: string

    Transaction:
      type: object
      required:
        - id
        - tx_hash
        - session_id
        - network
        - token_symbol
        - amount
        - detected_at
        - confirmed
      properties:
        id:
          type: string
        tx_hash:
          type: string
        session_id:
          type: string
        network:
          type: string
        token_symbol:
          type: string
        from_address:
          type: string
        to_address:
          type: string
        amount:
          type: number
          format: double
        detected_at:
          type: string
        confirmed:
          type: boolean
        block_number:
          type: integer
          format: int64

    CreateDemoSessionRequest:
      type: object
      description: "Optional overrides for a demo session; all fields default when omitted (solana/USDC/testnet). Demo sessions are testnet-only; mainnet is rejected."
      properties:
        chain:
          type: string
        token:
          type: string
        network:
          type: string
        amount:
          type: number
          format: double
      additionalProperties: false

    CreatePaymentSessionRequest:
      type: object
      description: >
        Provide exactly one of paymentMethod (legacy: a single, immediately
        bound method) or paymentMethods (a candidate set: the server
        intersects it with merchant policy, environment restriction, and
        currently enabled/certified rails, then returns a checkout intent for
        the payer to select from via POST
        /v1/payment_sessions/{session_id}/select_method). Supplying both, or
        neither, is a 400.
      required:
        - amount
        - expires_in
      properties:
        amount:
          type: number
          format: double
          description: "Expected amount to be paid"
        expires_in:
          type: string
          description: "Duration until session expires (e.g. 15m, 1h)"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PaymentMethod'
          description: >-
            Candidate method set for a payer-selects-one checkout. Mutually
            exclusive with paymentMethod.
        metadata:
          type: object
          description: "Optional key-value metadata (max 4KB)"
          additionalProperties: true
        return_url:
          type: string
          maxLength: 2048
          description: "URL to redirect the payer to after checkout completes. Must be an absolute https:// URL (http:// is allowed only for localhost, for merchant dev)."

    SelectPaymentMethodRequest:
      type: object
      required:
        - paymentMethod
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'

    PaymentMethod:
      type: object
      required:
        - chain
        - methodID
        - token
        - network
      properties:
        methodID:
          type: integer
          format: int64
          enum: [0, 1]
          description: "0 = crypto, 1 = fiat"
        chain:
          type: string
        token:
          type: string
        network:
          type: string

    PaymentSession:
      type: object
      required:
        - session_id
        - merchant_id
        - expected_amount
        - received_amount
        - address
        - status
        - metadata
        - expires_at
        - created_at
        - updated_at
        - paymentMethod
        - demo
      properties:
        session_id:
          type: string
        merchant_id:
          type: string
        expected_amount:
          type: number
          format: double
        received_amount:
          type: number
          format: double
        address:
          type: string
        status:
          type: string
          description: >-
            Lifecycle status of the session. The terminal settled status is
            "completed" (emitted alongside the payment_session.completed
            webhook). The legacy value "confirmed" is an accepted alias for the
            same terminal state.
        currency:
          type: string
          description: "Token symbol the session is denominated in"
        payment_url:
          type: string
          description: "Hosted checkout URL for the payer"
        qr_data:
          type: string
          description: "Payer payment URI for QR encoding"
        explorer_url:
          type: string
          description: "Block explorer URL for the deposit address"
        metadata:
          type: object
          additionalProperties: true
        expires_at:
          type: string
        completed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        demo:
          type: boolean
        simulated:
          type: boolean
          description: "true when the session was settled synthetically via /simulate; no on-chain transaction exists"
        tx_hash:
          type: string
          nullable: true
          description: "settlement transaction hash; present only after a real on-chain settlement"
        return_url:
          type: string
          description: "URL to redirect the payer to after checkout completes"
        diagnostics:
          $ref: '#/components/schemas/PaymentSessionDiagnostics'
        webhook_delivery:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        policy_version:
          type: string
          description: "Merchant payment-method policy snapshot version this session was evaluated against."
        method_selected_at:
          type: string
          description: "Set only when the session was materialized via POST .../select_method."

    PaymentSessionOrIntent:
      type: object
      description: >
        Same shape as PaymentSession, except address and paymentMethod are
        absent while status is awaiting_method_selection (a checkout intent
        that has not had a method selected yet). Returned only by
        createPaymentSession and getPaymentSession, the two operations whose
        response can genuinely be either a materialized session or a
        pre-selection intent; every other operation always returns a fully
        materialized PaymentSession.
      required:
        - session_id
        - merchant_id
        - expected_amount
        - received_amount
        - status
        - metadata
        - expires_at
        - created_at
        - updated_at
        - demo
      properties:
        session_id:
          type: string
        merchant_id:
          type: string
        expected_amount:
          type: number
          format: double
        received_amount:
          type: number
          format: double
        address:
          type: string
        status:
          type: string
          description: >-
            Lifecycle status of the session/intent. The terminal settled
            status is "completed" (emitted alongside the
            payment_session.completed webhook). The legacy value "confirmed"
            is an accepted alias for the same terminal state.
        currency:
          type: string
          description: "Token symbol the session is denominated in"
        payment_url:
          type: string
          description: "Hosted checkout URL for the payer"
        qr_data:
          type: string
          description: "Payer payment URI for QR encoding"
        explorer_url:
          type: string
          description: "Block explorer URL for the deposit address"
        metadata:
          type: object
          additionalProperties: true
        expires_at:
          type: string
        completed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        demo:
          type: boolean
        simulated:
          type: boolean
          description: "true when the session was settled synthetically via /simulate; no on-chain transaction exists"
        tx_hash:
          type: string
          nullable: true
          description: "settlement transaction hash; present only after a real on-chain settlement"
        return_url:
          type: string
          description: "URL to redirect the payer to after checkout completes"
        diagnostics:
          $ref: '#/components/schemas/PaymentSessionDiagnostics'
        webhook_delivery:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        candidate_payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          description: >-
            The merchant-policy / environment / enabled-rails intersection
            offered to the payer. Present only while status is
            awaiting_method_selection; the immutable snapshot computed at
            intent-creation time, never recomputed.
        policy_version:
          type: string
          description: "Merchant payment-method policy snapshot version this session (or intent) was evaluated against."
        method_selected_at:
          type: string
          description: "Set only when the session was materialized via POST .../select_method."

    FundSepoliaFaucetRequest:
      type: object
      required:
        - chain
        - address
      properties:
        chain:
          type: string
          description: "Only \"ethereum\" is accepted"
        address:
          type: string
          description: "Recipient EVM address on Sepolia testnet"

    FundSepoliaFaucetResponse:
      type: object
      required:
        - tx_hash
        - explorer_url
        - chain
        - network
        - amount
        - token_symbol
      properties:
        tx_hash:
          type: string
        explorer_url:
          type: string
        chain:
          type: string
        network:
          type: string
        amount:
          type: string
        token_symbol:
          type: string

    PaymentSessionDiagnostics:
      type: object
      required:
        - risk_level
        - summary
        - recommended_action
        - signals
      properties:
        risk_level:
          type: string
          enum:
            - ok
            - warning
            - critical
        summary:
          type: string
        recommended_action:
          type: string
        signals:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSessionDiagnosticSignal'

    PaymentSessionDiagnosticSignal:
      type: object
      required:
        - code
        - severity
        - title
        - detail
        - recommended_action
      properties:
        code:
          type: string
          enum:
            - underpayment
            - overpayment
            - wrong_token
            - wrong_chain
            - expired_session
            - missing_confirmations
            - stuck_session
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
        title:
          type: string
        detail:
          type: string
        recommended_action:
          type: string
        observed_network:
          type: string
        observed_token:
          type: string
        observed_confirmations:
          type: integer
          format: int64
        required_confirmations:
          type: integer
          format: int64
        observed_at:
          type: string
          format: date-time

    WebhookDeliveryStatus:
      type: object
      required:
        - status
        - attempts
        - manual_retry_count
      properties:
        status:
          type: string
          enum:
            - pending
            - delivered
            - failed
            - skipped
        event_type:
          type: string
        attempts:
          type: integer
          format: int64
        manual_retry_count:
          type: integer
          format: int64
        last_attempt_at:
          type: string
          format: date-time
        next_retry_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_http_status:
          type: integer
          format: int64
        latency_ms:
          type: integer
          format: int64

    Receipt:
      type: object
      required:
        - id
        - session_id
        - merchant_id
        - issued_at
        - amount
        - currency
      properties:
        id:
          type: string
        session_id:
          type: string
        merchant_id:
          type: string
        issued_at:
          type: string
          format: date-time
        amount:
          type: number
          format: double
        currency:
          type: string

    SweepResponse:
      type: object
      required:
        - success
        - sweep_tx_hash
      properties:
        success:
          type: boolean
        sweep_tx_hash:
          type: string

    RequestPayoutRequest:
      type: object
      required:
        - destination_address
        - amount
        - token_symbol
        - network
      properties:
        destination_address:
          type: string
          description: "Blockchain address to send the payout to"
        amount:
          type: number
          format: double
          description: "Amount to pay out"
        chain:
          type: string
          description: "Canonical payout chain (e.g. solana, ethereum, tron). Optional for legacy clients; omitted value is inferred from token where unambiguous enough for backward compatibility."
        token_symbol:
          type: string
          description: "Token symbol (e.g. SOL, ETH)"
        network:
          type: string
          description: "Settlement environment. Use mainnet or testnet; legacy aliases such as devnet/solana map to testnet and ethereum maps to mainnet."

    Payout:
      type: object
      required:
        - id
        - merchant_id
        - destination_address
        - amount
        - chain
        - token_symbol
        - network
        - status
        - requested_at
      properties:
        id:
          type: string
        merchant_id:
          type: string
        destination_address:
          type: string
        amount:
          type: number
          format: double
        chain:
          type: string
        token_symbol:
          type: string
        network:
          type: string
        tx_hash:
          type: string
        status:
          type: string
        requested_at:
          type: string
        sent_at:
          type: string

    AgentSpendAttemptRequest:
      type: object
      required:
        - target
        - amount
        - amount_subunits
        - token_symbol
        - chain
        - network
      properties:
        target:
          type: string
          description: "Destination address or outbound spend target"
        amount:
          type: number
          format: double
          description: "Human-readable spend amount"
        amount_subunits:
          type: string
          description: "Integer amount in token subunits"
          minLength: 1
          pattern: "^[1-9][0-9]*$"
        token_symbol:
          type: string
          description: "Token symbol (for example USDC)"
        chain:
          type: string
          description: "Target blockchain family"
        network:
          type: string
          description: "Target network such as mainnet or devnet"
        api_domain:
          type: string
          description: "API domain that originated the spend request"
        reference:
          type: string
          description: "Caller-provided reference for tracing the attempt; printable without whitespace"
          minLength: 1
          maxLength: 128
          pattern: "^[^\\s]+$"
        metadata:
          type: object
          description: "Opaque caller metadata for audit and policy context"
          additionalProperties: true

    AgentSpendAttempt:
      type: object
      required:
        - id
        - agent_wallet_id
        - status
        - spend_reference
        - target
        - amount
        - amount_subunits
        - token_symbol
        - chain
        - network
        - reason
        - created_at
      properties:
        id:
          type: string
          description: "Trace identifier for the evaluated attempt"
        agent_wallet_id:
          type: string
        ledger_entry_id:
          type: string
          description: "Ledger row created for pending or approval-required attempts"
        policy_id:
          type: string
          description: "Spend policy that determined the outcome when present"
        status:
          type: string
          enum: [pending, approval_required, denied]
        spend_reference:
          type: string
        target:
          type: string
        amount:
          type: number
          format: double
        amount_subunits:
          type: string
        token_symbol:
          type: string
        chain:
          type: string
        network:
          type: string
        api_domain:
          type: string
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    RegisterMerchantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "Merchant display name"
        sandbox:
          type: boolean
          description: "Create this merchant in sandbox mode (testnet-only sessions). Defaults to false."
        webhook_url:
          type: string
          description: "Optional webhook URL for payment notifications"
        idempotency_key:
          type: string
          description: "Idempotency key for replay-safe onboarding retries"
        registration_intent_id:
          type: string
          description: "Required for public/sandbox registration: the id returned by POST /v1/merchants/email-verification, after email verification and (unless invitation-exempt) proof-of-work are complete. Not used for bearer-authenticated live merchant creation."
        proof_of_work_challenge_id:
          type: string
          description: "Required for public/sandbox registration unless the registration intent carries a valid invitation token: the challenge_id from POST /v1/merchants/registration-proof-of-work"
        proof_of_work_nonce:
          type: string
          description: "The nonce solving the proof-of-work challenge"

    RequestEmailVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: "Email address to verify; must not belong to a disposable/temporary provider"
        invitation_token:
          type: string
          description: "Optional time-limited invitation/enrollment token that satisfies the trusted-email policy on its own"

    RequestEmailVerificationResponse:
      type: object
      required:
        - registration_intent_id
        - expires_at
      properties:
        registration_intent_id:
          type: string
          description: "Opaque id binding this verification, the subsequent proof-of-work challenge, and the final registration call together. Returned identically regardless of whether the email satisfies the trusted-email policy."
        expires_at:
          type: string
          format: date-time
          description: "When this registration intent (and everything bound to it) expires"

    ConfirmEmailVerificationRequest:
      type: object
      required:
        - registration_intent_id
        - code
      properties:
        registration_intent_id:
          type: string
        code:
          type: string
          description: "The one-time verification code delivered to the email address"

    ConfirmEmailVerificationResponse:
      type: object
      required:
        - registration_intent_id
        - verified
      properties:
        registration_intent_id:
          type: string
        verified:
          type: boolean

    RequestRegistrationProofOfWorkRequest:
      type: object
      required:
        - registration_intent_id
      properties:
        registration_intent_id:
          type: string

    RequestRegistrationProofOfWorkResponse:
      type: object
      required:
        - required
      properties:
        required:
          type: boolean
          description: "Whether a proof-of-work solution must be submitted with POST /v1/merchants. False only when the registration intent carries a valid invitation token."
        challenge_id:
          type: string
        algorithm_version:
          type: string
          description: "Versioned proof-of-work algorithm identifier, e.g. sha256-leading-zero-bits-v1"
        challenge:
          type: string
          description: "Random server-issued input the client must find a nonce for"
        difficulty:
          type: integer
          format: int64
          description: "Required number of leading zero bits in sha256(challenge:nonce)"
        expires_at:
          type: string
          format: date-time

    Merchant:
      type: object
      required:
        - id
        - name
        - api_key
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        sandbox:
          type: boolean
          description: "Whether this merchant is currently sandbox-only"
        email:
          type: string
        api_key:
          type: string
          description: "API key for authenticating requests"
        webhook_url:
          type: string
        webhook_secret:
          type: string
          description: "HMAC secret used to sign webhook deliveries (response only)"
        previous_api_key_expires_at:
          type: string
          format: date-time
          description: "When the previous API key stops authenticating after a rotation overlap"
        previous_webhook_secret_expires_at:
          type: string
          format: date-time
          description: "When the previous webhook secret stops being included in signatures after a rotation overlap"
        rate_limit_per_minute:
          type: integer
          format: int64
        created_at:
          type: string

    MerchantCredentialOperationRequest:
      type: object
      required:
        - credential_type
      properties:
        credential_type:
          type: string
          enum:
            - api_key
            - webhook_secret
          description: "Credential kind to rotate or revoke"

    MerchantCredentialStatus:
      type: object
      required:
        - api_key_prefix
        - sandbox
        - webhook_secret_configured
        - created_at
      properties:
        api_key_prefix:
          type: string
          description: "Masked API key, e.g. plaidly_sk_live_...a1b2"
        api_key_created_at:
          type: string
          format: date-time
          description: "When the merchant (and its initial API key) was created"
        api_key_last_rotated_at:
          type: string
          format: date-time
          description: "When the API key was last rotated, absent if never rotated"
        previous_api_key_expires_at:
          type: string
          format: date-time
          description: "Present only while a previous API key is still valid in its rotation-overlap grace period"
        webhook_secret_configured:
          type: boolean
          description: "Whether a webhook secret has been generated for this merchant"
        webhook_secret_mask:
          type: string
          description: "Masked webhook secret, e.g. plaidly_whsec_...a1b2. Absent if no webhook secret is configured"
        webhook_secret_last_rotated_at:
          type: string
          format: date-time
          description: "When the webhook secret was last rotated, absent if never rotated"
        previous_webhook_secret_expires_at:
          type: string
          format: date-time
          description: "Present only while a previous webhook secret is still valid in its rotation-overlap grace period"
        sandbox:
          type: boolean
          description: "Whether this merchant is currently sandbox-only"
        created_at:
          type: string
          format: date-time

    PaymentMethodInfo:
      type: object
      required:
        - chain
        - network
        - token
        - display_name
        - decimals
        - kind
      properties:
        chain:
          type: string
        network:
          type: string
        token:
          type: string
        display_name:
          type: string
        decimals:
          type: integer
          format: int64
        kind:
          type: string
          description: "native, erc20, trc20, spl, jetton"
        min_amount:
          type: number
          format: double

    PaymentMethodPolicyIdentity:
      type: object
      required:
        - chain
        - network
        - token
      properties:
        chain:
          type: string
        network:
          type: string
        token:
          type: string
          description: "Canonical token symbol, resolved server-side against the registry entry for this chain/network"

    PaymentMethodPolicyEntry:
      type: object
      required:
        - chain
        - network
        - token
        - kind
        - enabled
        - eligible
        - effective
      properties:
        chain:
          type: string
        network:
          type: string
        token:
          type: string
        kind:
          type: string
          description: "native, erc20, trc20, spl, jetton"
        contract:
          type: string
          description: "Contract or mint address, resolved from the canonical registry. Absent for native tokens."
        decimals:
          type: integer
          format: int64
        enabled:
          type: boolean
          description: "The merchant's raw declared intent from the current policy version"
        eligible:
          type: boolean
          description: "Whether this identity currently passes registry/settlement/environment/certification eligibility"
        eligibility_reason:
          type: string
          description: "Present when eligible is false; explains why the dashboard should grey this option out"
        effective:
          type: boolean
          description: "enabled && eligible, recomputed live. This is what checkout session creation will see."

    PaymentMethodPolicyState:
      type: object
      required:
        - version
        - environment
        - entries
      properties:
        version:
          type: integer
          format: int64
          description: "0 when the merchant has never written a policy version"
        environment:
          type: string
          description: "live or sandbox, derived from the merchant's own sandbox flag"
        updated_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodPolicyEntry'

    UpdatePaymentMethodPolicyRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: array
          description: "The merchant's full desired set of enabled identities. Identities not listed are disabled. An empty array disables every method."
          items:
            $ref: '#/components/schemas/PaymentMethodPolicyIdentity'

    UpdateMerchantWebhookRequest:
      type: object
      required:
        - webhook_url
      properties:
        webhook_url:
          type: string
          description: "New webhook URL. Validated against the same SSRF rules enforced at merchant registration."

    WebhookTestDeliveryResult:
      type: object
      required:
        - delivered
      properties:
        delivered:
          type: boolean
        status_code:
          type: integer
          format: int64
        message:
          type: string

    RateInfo:
      type: object
      required:
        - symbol
        - usd
        - updated_at
      properties:
        symbol:
          type: string
        usd:
          type: number
          format: double
        updated_at:
          type: string

    X402PaymentPayload:
      type: object
      required:
        - chain
        - network
        - token
      additionalProperties: false
      properties:
        chain:
          type: string
          description: Payment chain slug (e.g. solana, ethereum)
        network:
          type: string
          description: Network alias (e.g. testnet, mainnet, sepolia, holesky)
        token:
          type: string
          description: Token symbol (e.g. USDC, USDT)

    X402ValidationResult:
      type: object
      required:
        - supported
        - outcome
      properties:
        supported:
          type: boolean
          description: Whether the payload is supported for payment
        outcome:
          type: string
          description: >
            Classifier for downstream handling:
            terminal for hard/definitive result, retryable for transient issues.
          enum:
            - retryable
            - terminal
        reason:
          type: string
          description: Human-readable reason for the outcome

    SendRequest:
      type: object
      required:
        - to_address
        - amount
        - token
      properties:
        to_address:
          type: string
        amount:
          type: number
          format: double
        token:
          type: string

    SendResponse:
      type: object
      required:
        - success
        - tx_hash
      properties:
        success:
          type: boolean
        tx_hash:
          type: string

    CatalogStore:
      type: object
      description: A merchant's storefront/business profile. Does not version; mutates in place regardless of status.
      required:
        - id
        - merchant_id
        - sandbox
        - name
        - slug
        - status
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time

    CreateStoreRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true

    PatchStoreRequest:
      type: object
      description: "All fields optional; only fields present are applied."
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true

    StoreListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogStore'
        next_cursor:
          type: string
          description: "Opaque cursor for the next page. Absent when there is no further page."

    CatalogProduct:
      type: object
      description: A product belonging to a store. Immutable once published or checkout-referenced (directly, or transitively via one of its plans/prices).
      required:
        - id
        - store_id
        - merchant_id
        - sandbox
        - name
        - slug
        - fulfillment_type
        - status
        - version
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        store_id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        fulfillment_type:
          type: string
          enum: [one_time, subscription, metered, service]
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
          format: int64
        supersedes_product_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required:
        - store_id
        - name
        - slug
        - fulfillment_type
      properties:
        store_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        fulfillment_type:
          type: string
          enum: [one_time, subscription, metered, service]
        metadata:
          type: object
          additionalProperties: true

    PatchProductRequest:
      type: object
      description: "All fields optional; only fields present are applied. The store_id relationship cannot be changed via PATCH."
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        fulfillment_type:
          type: string
          enum: [one_time, subscription, metered, service]
        metadata:
          type: object
          additionalProperties: true

    ProductListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        next_cursor:
          type: string

    CatalogPlan:
      type: object
      description: A purchasable variant of a product (e.g. "monthly"). Immutable once published or checkout-referenced (directly, or transitively via one of its prices).
      required:
        - id
        - product_id
        - merchant_id
        - sandbox
        - name
        - slug
        - status
        - version
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        product_id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
          format: int64
        supersedes_plan_id:
          type: string
        entitlement:
          type: object
          description: "Freeform catalog metadata describing what the buyer gets (quota/seats/duration etc). Not a runtime entitlement-tracking system."
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time

    CreatePlanRequest:
      type: object
      required:
        - product_id
        - name
        - slug
      properties:
        product_id:
          type: string
        name:
          type: string
        slug:
          type: string
        entitlement:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    PatchPlanRequest:
      type: object
      description: "All fields optional; only fields present are applied. The product_id relationship cannot be changed via PATCH."
      properties:
        name:
          type: string
        slug:
          type: string
        entitlement:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    PlanListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPlan'
        next_cursor:
          type: string

    CatalogPrice:
      type: object
      description: A price belonging to a plan. Immutable once published or checkout-referenced.
      required:
        - id
        - plan_id
        - merchant_id
        - sandbox
        - amount_subunits
        - currency_or_token
        - status
        - version
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        plan_id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        amount_subunits:
          type: string
          description: "Integer amount in smallest token/currency subunits"
        currency_or_token:
          type: string
          description: "The token/currency symbol this price is denominated in, e.g. USDC"
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
          format: int64
        supersedes_price_id:
          type: string
        allowed_payment_methods:
          type: array
          description: "Canonical chain:network:token identity strings (e.g. solana:mainnet:USDC). Null/absent means no restriction; defer to merchant-wide payment policy."
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time

    CreatePriceRequest:
      type: object
      required:
        - plan_id
        - amount_subunits
        - currency_or_token
      properties:
        plan_id:
          type: string
        amount_subunits:
          type: string
          minLength: 1
          pattern: "^[0-9]+$"
        currency_or_token:
          type: string
        allowed_payment_methods:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    PatchPriceRequest:
      type: object
      description: "All fields optional; only fields present are applied. The plan_id relationship cannot be changed via PATCH."
      properties:
        amount_subunits:
          type: string
          minLength: 1
          pattern: "^[0-9]+$"
        currency_or_token:
          type: string
        allowed_payment_methods:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    PriceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'
        next_cursor:
          type: string

    CatalogDiscoveryPlan:
      type: object
      description: A published plan nested inside a discovery product response, with its published prices inlined.
      required:
        - id
        - product_id
        - merchant_id
        - sandbox
        - name
        - slug
        - status
        - version
        - metadata
        - created_at
        - updated_at
        - prices
      properties:
        id:
          type: string
        product_id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
          format: int64
        entitlement:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        prices:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'

    CatalogDiscoveryProduct:
      type: object
      description: A published product returned by buyer-agent discovery, with its published plans (and their published prices) inlined so a buyer agent needs only one round trip.
      required:
        - id
        - store_id
        - merchant_id
        - sandbox
        - name
        - slug
        - fulfillment_type
        - status
        - version
        - metadata
        - created_at
        - updated_at
        - plans
      properties:
        id:
          type: string
        store_id:
          type: string
        merchant_id:
          type: string
        sandbox:
          type: boolean
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        fulfillment_type:
          type: string
          enum: [one_time, subscription, metered, service]
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        plans:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDiscoveryPlan'

    CatalogProductListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDiscoveryProduct'
        next_cursor:
          type: string

    CatalogCheckoutIntent:
      type: object
      description: >
        Result of resolving a published price for checkout. A buyer agent uses
        these fields to build a POST /v1/payment_sessions request, placing
        checkout_reference_id into that request's free-form metadata object.
      required:
        - checkout_reference_id
        - price_id
        - plan_id
        - product_id
        - store_id
        - merchant_id
        - amount_subunits
        - currency_or_token
        - expires_at
      properties:
        checkout_reference_id:
          type: string
        price_id:
          type: string
        plan_id:
          type: string
        product_id:
          type: string
        store_id:
          type: string
        merchant_id:
          type: string
        amount_subunits:
          type: string
        currency_or_token:
          type: string
        allowed_payment_methods:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time

tags:
  - name: Merchants
  - name: Receipts
  - name: Me
  - name: Wallets
  - name: Transactions
  - name: PaymentSessions
  - name: Payouts
  - name: x402
  - name: Catalog
  - name: CatalogDiscovery
